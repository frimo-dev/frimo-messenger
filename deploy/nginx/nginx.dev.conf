events {}

http {
    limit_req_zone $binary_remote_addr zone=resend_per_ip:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=register_per_ip:10m rate=5r/m;

    server {
        listen 80;

        error_page 429 = @rate_limit_error;

        location = /auth/resend {
            limit_req zone=resend_per_ip burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://host.docker.internal:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /auth/register {
            limit_req zone=register_per_ip burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://host.docker.internal:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @rate_limit_error {
            default_type application/json;
            return 429 '{"error":{"code":"rate_limit_exceeded","message":"too many requests"}}';
        }

        location / {
            proxy_pass http://host.docker.internal:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}