services:
  nginx:
    image: nginx:alpine
    container_name: messenger-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
  api:
    build:
      context: .
    command: /usr/local/bin/server
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
  worker:
    build:
      context: .
    command: /usr/local/bin/worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    container_name: messenger-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  scylla:
    image: scylladb/scylla:6.2
    restart: unless-stopped
    container_name: messenger-scylla
    command: --smp 1 --memory 1G --authenticator PasswordAuthenticator --authorizer CassandraAuthorizer
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: [ "CMD-SHELL", "nodetool status | grep -q '^UN'" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
  scylla-init:
    image: scylladb/scylla:6.2
    container_name: scylla-init
    entrypoint:
      - /bin/bash
      - /bootstrap/set-password.sh
    environment:
      SCYLLA_PASSWORD: ${SCYLLA_PASSWORD:?SCYLLA_PASSWORD is required}
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:?SCYLLA_KEYSPACE is required}
    volumes:
      - ./deploy/scylla/set-password.sh:/bootstrap/set-password.sh:ro
    depends_on:
      scylla:
        condition: service_healthy
    restart: "no"
  scylla-migrate:
    image: migrate/migrate:v4.19.1
    profiles:
      - tools
    env_file:
      - .env
    volumes:
      - ./migrations/scylla:/migrations:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        exec migrate \
          -path=/migrations \
          -database="cassandra://scylla:9042/$${SCYLLA_KEYSPACE}?username=$${SCYLLA_USERNAME}&password=$${SCYLLA_PASSWORD}&x-multi-statement=true" \
          "$$@"
      - --
    command:
      - up
    depends_on:
      scylla-init:
        condition: service_completed_successfully
    restart: "no"
  redis:
    image: redis:8.10.2-alpine
    container_name: messenger-redis
    ports:
      - "${REDIS_ADDR}:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG" ]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  migrate:
    image: migrate/migrate
    profiles:
      - tools
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations/postgres
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  scylla_data:
  redis_data: